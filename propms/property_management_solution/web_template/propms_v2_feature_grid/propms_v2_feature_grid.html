<section{% if section_id %} id="{{ section_id | e }}"{% endif %} class="v2-component v2-component--feature-grid v2-theme-{{ theme or 'default' }}">
  <div class="v2-component__inner">
    <div class="v2-section-heading">{% if eyebrow %}<p class="v2-eyebrow">{{ eyebrow | e }}</p>{% endif %}<h2>{{ title | e }}</h2>{% if description %}<p>{{ description | e }}</p>{% endif %}</div>
    <div class="v2-grid v2-grid--features v2-grid--{{ variant or 'cards' }}">
      {% for item in items or [] %}
      <article class="v2-card v2-card--interactive"><h3>{{ item.title | e }}</h3>{% if item.description %}<p>{{ item.description | e }}</p>{% endif %}</article>
      {% endfor %}
    </div>
  </div>
</section>
