<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
    }

    body {
      font-family: sans-serif;
    }

    #map-capture {
      width: {{ capture_visible_width_css_px }}px;
      height: {{ capture_visible_height_css_px }}px;
      overflow: hidden;
      background: #fff;
    }

    #map-capture iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #map-capture.custom-map-frame--google-my-maps {
      position: relative;
      overflow: hidden;
    }

    #map-capture.custom-map-frame--google-my-maps iframe {
      height: calc(100% + var(--pi-my-maps-header-crop));
      transform: translateY(calc(-1 * var(--pi-my-maps-header-crop)));
      transform-origin: top center;
    }
  </style>
</head>
<body
  style="--pi-my-maps-header-crop: {{ my_maps_header_crop_px }}px;"
  data-my-maps-presentation-version="{{ my_maps_presentation_version }}"
  data-capture-implementation-version="{{ capture_implementation_version }}"
  data-capture-template-version="{{ capture_template_version }}"
  data-capture-map-kind="{{ map_kind }}"
  data-capture-map-source-hash="{{ map_source_hash }}">
  <div
    id="map-capture"
    class="custom-map-frame custom-map-frame--{{ map_kind_class }}"
    data-map-capture-key="{{ map_key }}"
    {% if map_row_name %}data-map-row-name="{{ map_row_name }}"{% endif %}>
    <iframe
      src="{{ map_embed_url }}"
      title="{{ map_title or 'Map capture' }}"
      loading="eager"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
</body>
</html>
